name: Bug report
description: Report a reproducible problem in LONG VIDEO RETRIEVAL.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior without attaching private media.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include task profile, media metadata, source frame indexes/PTS, and steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private media, credentials, and personal data.
          required: true

